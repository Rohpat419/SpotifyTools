databases:
  - name: spotifytools-db
    plan: free
    databaseName: spotifytools
    user: spotifytools

services:
  - type: web
    name: spotify_tools
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && ./build.sh
    startCommand: gunicorn spotifytools_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: spotifytools-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://spotify-tools-jo2u.onrender.com/api/auth/callback
      - key: SPOTIFY_SCOPES
        value: playlist-modify-private playlist-read-private user-top-read user-library-read
      - key: FRONTEND_SUCCESS_URL
        value: https://spotify-tools-xi.vercel.app/auth/success
      - key: DJANGO_SETTINGS_MODULE
        value: spotifytools_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: spotify-tools-jo2u.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotify-tools-xi.vercel.app
